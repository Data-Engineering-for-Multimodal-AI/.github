<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>:root{--w:880px;--h:220px}
body.dark{--bg:#111113;--ink:#ededef;--muted:#a1a1a8;--dot:rgba(255,255,255,.07);--glass:rgba(255,255,255,.035);--glass-edge:rgba(255,255,255,.08);--hi:rgba(255,255,255,.04);--shadow:rgba(0,0,0,.35);--coral-soft:rgba(255,159,142,.12);--coral-ink:#ffb4a6;--chip-ink:#d4d4d8}
body.dark .canvas::before{background:radial-gradient(38% 40% at 12% 10%, rgba(255,159,142,.16), transparent 70%)}
.row{height:220px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:24px}
.left{display:flex;align-items:center;gap:20px}
.label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px}.mk{width:30px;height:30px;border-radius:10px;background:var(--coral-soft);display:grid;place-items:center}
h1{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:14px;font-weight:600;color:var(--muted);margin-top:10px;line-height:1.35}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.pill{font-size:14px;padding:7px 14px}
.icons{display:grid;grid-template-columns:repeat(3,44px);gap:8px}
.ic{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:0 6px 16px var(--shadow);display:grid;place-items:center}.sub i{margin-right:.28em}</style>
<body><div class="canvas"><div class="row">
<div class="left"><div><div class="label">The Playbooks</div><h1>Hands-on data engineering<br>for multimodal AI</h1><div class="sub">Runnable companion code for <i>Data Engineering for Multimodal AI</i> (O'Reilly, 2026)</div></div></div>
<div class="right"><span class="pill">17 playbooks</span><div class="icons" id="i"></div></div>
</div></div>
<script>
MODS.audio={glyph:'<path d="M4 12h1.5M8 8v8M11.5 5v14M15 9v6M18.5 11v2"/>'};
MODS.sensor={glyph:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>'};
const dark=location.hash==='#dark'; if(dark)document.body.classList.add('dark');

const ink=getComputedStyle(document.body).getPropertyValue('--chip-ink').trim()||'#3d3534';
document.getElementById('i').innerHTML=['image','text','audio','video','sensor','table'].map(m=>`<div class="ic">${glyph(m,ink,22)}</div>`).join('');
</script></body>
